name: Publish exhibition to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exhibition-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy exhibition
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and exhibit images
        env:
          EXHIBITION_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base = new URL(process.env.EXHIBITION_URL);
          const expected = fs.readFileSync('dist/index.html', 'utf8');
          const script = expected.match(/<script[^>]*src="([^"]+)"/)[1];
          let ready = false;
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(base, {signal: AbortSignal.timeout(20000)});
            const html = await response.text();
            if (response.ok && html.includes(script)) { ready = true; break; }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!ready) throw Error('Published page is not serving the current build');
          const products = JSON.parse(fs.readFileSync('src/data/wenchuang.json', 'utf8'));
          const images = [...new Set(products.map(product => product.image))];
          const assets = [script, ...images.map(image => 'assets/' + image)];
          for (const asset of assets) {
            const response = await fetch(new URL(asset, base), {signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw Error(asset + ': HTTP ' + response.status);
            const data = Buffer.from(await response.arrayBuffer());
            if (asset.endsWith('.webp') && (data.toString('ascii', 0, 4) !== 'RIFF' || data.toString('ascii', 8, 12) !== 'WEBP')) throw Error('Invalid image: ' + asset);
            console.log('Verified:', asset, response.status);
          }
          console.log('Published exhibition verified:', base.href);
          JS
